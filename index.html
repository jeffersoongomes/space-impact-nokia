<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Impact - Nokia 3310 Retro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nokia-body">
        <div class="nokia-speaker"></div>
